; PlatformIO Project Configuration File —— B-Box ESP32-S3 固件
;
; 三个构建环境（板子相同，用 build_src_filter 选源文件、用宏选无线角色）：
;   wired_sim        阶段2：有线串口模拟固件（无传感器，按键/串口触发）
;   espnow_sender    阶段10 预研：无线“箱子端”发送器
;   espnow_receiver  阶段10 预研：无线“接收端”（插 PC，串口协议不变）
;
; 常用命令（在 esp32_shot/ 目录）：
;   pio run                              编译全部环境
;   pio run -e wired_sim -t upload       烧录有线模拟固件
;   pio run -e espnow_sender -t upload   烧到“箱子端”那块板
;   pio run -e espnow_receiver -t upload 烧到插 PC 的那块板
;   pio device monitor -e wired_sim      打开串口监视器
;
; 说明：4d_systems_esp32s3_gen4_r8n16 板级定义已内置
;       ARDUINO_USB_MODE=1 / ARDUINO_USB_CDC_ON_BOOT=1，
;       原生 USB 口即可直接收发串口，无需额外配置。

[env]
platform = espressif32
board = 4d_systems_esp32s3_gen4_r8n16
framework = arduino
monitor_speed = 115200

[env:wired_sim]
build_src_filter = -<*> +<main_wired.cpp>

[env:espnow_sender]
build_flags = -D ROLE_SENDER
build_src_filter = -<*> +<main_espnow.cpp>

[env:espnow_receiver]
build_flags = -D ROLE_RECEIVER
build_src_filter = -<*> +<main_espnow.cpp>

[env:blink]
build_src_filter = -<*> +<main_blink.cpp>
